name: cali-workspace-v2-ingress
services:
  ingress:
    image: haproxy:3.3-alpine@sha256:75adccfd45f1bb9eaba777b80f93a249e66a8309d6d4f0c65410b683a3906728
    container_name: cali-workspace-v2-ingress
    user: haproxy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_forward: '0'
      net.ipv6.conf.all.forwarding: '0'
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.5
    restart: 'no'
    labels:
      com.cali.local.project: cali-workspace-v2-local
      com.cali.local.role: ingress
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - 127.0.0.1:56321:56321
      - 127.0.0.1:56322:56322
      - 127.0.0.1:56324:56324
      - 127.0.0.1:56325:56325
    networks: [isolated, ingress]
networks:
  isolated:
    external: true
    name: cali-workspace-v2-isolated
  ingress:
    external: true
    name: cali-workspace-v2-ingress
