global
  maxconn 128

defaults
  mode tcp
  timeout connect 3s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver embedded 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold nx 1s

# Destinos fixos; não é HTTP CONNECT, SOCKS nem gateway de rede.
listen database
  bind :56322
  server local_db supabase_db_cali-workspace-v2-local:5432 resolvers docker init-addr none check inter 1s

listen api
  bind :56321
  server local_api supabase_kong_cali-workspace-v2-local:8000 resolvers docker init-addr none check inter 1s

listen mail
  bind :56324
  server local_mail supabase_inbucket_cali-workspace-v2-local:8025 resolvers docker init-addr none check inter 1s

listen smtp
  bind :56325
  server local_smtp supabase_inbucket_cali-workspace-v2-local:1025 resolvers docker init-addr none check inter 1s
